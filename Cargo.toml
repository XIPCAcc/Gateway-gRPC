[workspace]
members = [
    "proto",
    "backend",
    "gateway",
    "shared-memory",
]
resolver = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(fuzzing)',
  'cfg(loom)',
  'cfg(mio_unsupported_force_poll_poll)',
  'cfg(tokio_allow_from_blocking_fd)',
  'cfg(tokio_internal_mt_counters)',
  'cfg(tokio_no_parking_lot)',
  'cfg(tokio_no_tuning_tests)',
  'cfg(tokio_unstable)',
  'cfg(target_os, values("cygwin"))',
] }

[workspace.dependencies]
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1.0"
http-body = "1.0"
http-body-util = "0.1"
async-trait = "0.1"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
prometheus = "0.13"
lazy-static = "1.4"
uuid = { version = "1.6", features = ["v4"] }
libc = "0.2"
nix = { version = "0.27", features = ["mman", "event", "socket", "uio"] }
memmap2 = "0.9"
crossbeam = "0.8"
dashmap = "5.5"
parking_lot = "0.12"
bytes = "1.5"
futures = "0.3"

[patch.crates-io]
tokio = { path = "./tokio/tokio" }
tokio-stream = { path = "./tokio/tokio-stream" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
